# 깨끗한 환경 검사(수동). 평소 검사는 푸시 전 훅(business ops/release-checks.md 9장)
name: CI

on:
  # 자동 실행은 끔(2026-11-23 사용자 결정): 검사는 푸시 전에 이 PC에서 .githooks/pre-push가 한다.
  # 깨끗한 환경에서 확인하고 싶을 때만 GitHub › Actions › CI › Run workflow로 돌린다(포함량을 쓴다)
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run test
